; Phase 16 deployment checklist (docs/09-deployment.md, section 3).
;
; Template for a Linux production host. Adjust:
;   - directory / command paths (assumes the app is deployed to
;     /var/www/chandaktext/backend - change both to match the real path)
;   - user (the web server / deploy user, NOT root)
;   - numprocs (how many concurrent queue:work processes - start with 2,
;     raise if exports/AI-call/document-processing jobs start backing up)
;
; Install:
;   cp deploy/supervisor-queue-worker.conf /etc/supervisor/conf.d/chandaktext-queue-worker.conf
;   supervisorctl reread
;   supervisorctl update
;   supervisorctl start chandaktext-queue-worker:*
;
; After any deploy that changes queued-job code, restart workers so they
; pick up the new code (queue:work holds the app booted in memory between
; jobs - it will NOT see new code until restarted, see docs/PROGRESS.md's
; Phase 12-13 section for a real incident this caused locally):
;   php artisan queue:restart
; (sends a graceful-restart signal workers pick up after their current job
; - supervisor then respawns them per autorestart below)

[program:chandaktext-queue-worker]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/chandaktext/backend/artisan queue:work redis --sleep=3 --tries=3 --max-time=3600
directory=/var/www/chandaktext/backend
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=www-data
numprocs=2
redirect_stderr=true
stdout_logfile=/var/www/chandaktext/backend/storage/logs/queue-worker.log
stopwaitsecs=3600
